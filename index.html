<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álbum Pokédex TCG 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0e0e11;--pp:#fbf7ec;--tx:#1c1b22;--mu:#6b6878;--ln:#d8d0bd;--ac:#d6372b;--px:"Press Start 2P",ui-monospace,monospace;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--pp:#22202a;--tx:#f1eff6;--mu:#a09cb0;--ln:#3a3846;--ac:#ff5a4d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:#08080a;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}

/* ===== Tapete Negro ===== */
.playmat-table{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#181820 0%,#040406 100%);display:flex;align-items:center;justify-content:center;z-index:-1;overflow:hidden}
.playmat{width:min(96vw,1300px);height:min(88vh,860px);background:#121216;border-radius:28px;border:8px solid #0a0a0d;box-shadow:inset 0 0 90px rgba(0,0,0,.95),0 25px 60px rgba(0,0,0,.9);position:relative;display:flex;align-items:center;justify-content:center}
.playmat::before{content:"";position:absolute;inset:16px;border:2px dashed rgba(255,255,255,.06);border-radius:20px;pointer-events:none}
.playmat-logo{position:absolute;width:300px;height:300px;border-radius:50%;border:8px solid rgba(255,255,255,.02);background:radial-gradient(rgba(255,255,255,.015),transparent);pointer-events:none;display:flex;align-items:center;justify-content:center}
.playmat-logo::after{content:"";width:100px;height:100px;border-radius:50%;border:6px solid rgba(255,255,255,.02)}

/* ===== HUD Lateral ===== */
.hud-panel{position:fixed;top:20px;left:20px;background:rgba(18,18,22,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 22px;color:#fff;z-index:20;box-shadow:0 12px 35px rgba(0,0,0,.6);min-width:255px}
.hud-title{font-family:var(--px);font-size:9px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hud-led{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.hud-val{font-family:var(--px);font-size:18px;color:#4ade80;margin-bottom:8px}
.hud-sub{font-size:12px;color:#a09cb0;margin-bottom:8px;display:flex;justify-content:space-between}
.hud-bar{height:8px;background:#2a2833;border-radius:6px;overflow:hidden;margin-bottom:14px}.hud-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a4d,#4ade80);transition:width .6s}
.hud-section{font-size:10px;color:var(--mu);margin:10px 0 6px;font-family:var(--px);text-transform:uppercase}
.hud-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.hud-btn{background:#262430;color:#d8d0bd;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 8px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.hud-btn:hover{background:#3a3846;color:#fff;border-color:var(--ac)}
.hud-select, .hud-input{width:100%;background:#262430;color:#d8d0bd;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;margin-bottom:6px}
.hud-input:focus{border-color:var(--ac);color:#fff}

/* Dropdown de Búsqueda */
.search-results{background:#1b1922;border:1px solid rgba(255,255,255,.15);border-radius:8px;max-height:160px;overflow-y:auto;display:none;margin-bottom:8px}
.search-results.open{display:block}
.search-item{padding:8px 12px;font-size:11px;color:#d8d0bd;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.search-item:hover{background:var(--ac);color:#fff}

/* Filtros rápidos */
.filter-bar{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.04);padding:4px;border-radius:10px}
.filter-btn{flex:1;background:none;border:none;color:var(--mu);padding:6px 4px;border-radius:7px;font-size:9px;font-family:var(--px);cursor:pointer;transition:all .2s}
.filter-btn.active{background:var(--ac);color:#fff}

/* Insignias */
.badges-container{display:flex;gap:4px;margin-top:4px;justify-content:space-between}
.badge-icon{font-size:14px;opacity:0.25;transition:opacity .3s, transform .3s;filter:grayscale(1)}
.badge-icon.active{opacity:1;filter:none;transform:scale(1.15)}

/* ===== Escena 3D ===== */
.scene{--pw:min(46vw,480px);perspective:2500px;padding:10px 0;display:flex;justify-content:center;align-items:center;width:100%;cursor:grab}
.scene:active{cursor:grabbing}
.book{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)*1.42);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.1,.2,1);transform:translateX(calc(var(--pw)*-.5))}
.book.open{transform:none!important}
.book.end{transform:translateX(calc(var(--pw)*.5))!important}

.sh{position:absolute;left:50%;top:0;width:var(--pw);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.1,.2,1);pointer-events:none}
.sh.f{transform:rotateY(-180deg) translateZ(calc(var(--i)*0.4px))}
.sh:not(.f){transform:rotateY(0deg) translateZ(calc((var(--n) - var(--i))*0.4px))}

.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;container-type:inline-size;background:var(--pp);overflow:hidden;pointer-events:none!important}
.fr{border-radius:2px 10px 10px 2px;box-shadow:0 12px 36px rgba(0,0,0,.5),inset 8px 0 14px -8px rgba(0,0,0,.4)}
.bk{transform:rotateY(180deg);border-radius:10px 2px 2px 10px;box-shadow:0 12px 36px rgba(0,0,0,.5),inset -8px 0 14px -8px rgba(0,0,0,.4)}

.sh.active-left .bk{pointer-events:auto!important;z-index:10}
.sh.active-right .fr{pointer-events:auto!important;z-index:10}
.sh.active-left .bk *, .sh.active-right .fr *{pointer-events:auto!important}

/* ===== Portada Premium ===== */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5cqw;font-family:var(--px);text-align:center;cursor:pointer;font-size:8cqw;pointer-events:auto!important;transition:all .3s;box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 15px 40px rgba(0,0,0,.6);position:relative}
.cover::before{content:"";position:absolute;inset:12px;border:3px double rgba(246,211,107,.4);border-radius:8px;pointer-events:none}
.cover small{font-size:4cqw;animation:bl 1.4s steps(2) infinite;letter-spacing:1px}
@keyframes bl{50%{opacity:.2}}

.cover-badge{background:rgba(0,0,0,.4);border:2px solid #f6d36b;padding:6px 16px;border-radius:20px;color:#f6d36b;font-size:3.5cqw;letter-spacing:2px}

.theme-red{background:linear-gradient(135deg,#b02418,#6e1008);border:4px solid #420804;color:#f6d36b}
.theme-red .ball{border-color:#111;background:linear-gradient(#e63b2e 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 25px rgba(230,59,46,.5),0 0 0 1.5cqw #f6d36b}
.theme-ultra{background:linear-gradient(135deg,#233342,#111a22);border:4px solid #090e13;color:#f1c40f}
.theme-ultra .ball{border-color:#111;background:linear-gradient(#f39c12 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 25px rgba(243,156,18,.5),0 0 0 1.5cqw #f1c40f}
.theme-master{background:linear-gradient(135deg,#73318f,#401b50);border:4px solid #230d2d;color:#e84393}
.theme-master .ball{border-color:#111;background:linear-gradient(#9b59b6 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 25px rgba(155,89,182,.5),0 0 0 1.5cqw #e84393}
.theme-leather{background:linear-gradient(135deg,#2e1a0e,#190d07);border:4px solid #0b0503;color:#d4af37}
.theme-leather .ball{border-color:#111;background:linear-gradient(#d4af37 0 45%,#111 45% 55%,#222 55%);box-shadow:0 0 25px rgba(212,175,55,.5),0 0 0 1.5cqw #d4af37}

.ball{width:40cqw;aspect-ratio:1;border-radius:50%;border:1.6cqw solid #111;position:relative}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:12cqw;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:1.6cqw solid #111;box-shadow:0 0 10px rgba(255,255,255,.8)}

.pgi{position:absolute;inset:0;padding:4cqw;display:flex;flex-direction:column}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5cqw}
.ft{margin-top:auto;text-align:center;font-family:var(--px);font-size:3cqw;color:var(--mu)}

/* ===== Huecos y Sprites ===== */
.slot{aspect-ratio:5/7;border-radius:8px;border:0;padding:0;cursor:pointer;background:none;font-family:inherit;container-type:inline-size;display:block;width:100%;position:relative}
.slot.e{background:#cadba0;border:2px solid #306230;color:#0f380f;font-family:var(--px);display:flex;flex-direction:column;align-items:center;padding:5cqw 4cqw;border-radius:6px;transition:transform .15s,filter .15s}
.slot.e:hover{transform:translateY(-3px);filter:brightness(1.08)}
.slot .nn{font-size:8.5cqw;align-self:flex-start}
.slot img.sp{width:84cqw;flex:1;min-height:0;object-fit:contain;image-rendering:pixelated}
.slot .nm{font-size:7.5cqw;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.show .slot{animation:pop .45s both;animation-delay:calc(var(--j)*70ms + .45s)}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}

/* ===== Cartas ===== */
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:4.5%;overflow:hidden;transition:transform .15s;background:#0002}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.shine{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 15%,rgba(255,0,128,.5),rgba(0,255,220,.5),rgba(255,230,0,.5),transparent 85%);background-size:250% 250%;background-position:var(--mx,30%) var(--my,30%);mix-blend-mode:soft-light}
.holo .shine{opacity:.5}.holo.on .shine{opacity:1}

.slot.just-placed .card{animation:placeCard .6s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes placeCard{
 0%{transform:scale(1.3) translateY(-25px) rotate(-5deg);opacity:0;box-shadow:0 25px 35px rgba(0,0,0,.6)}
 70%{transform:scale(0.96) translateY(2px);opacity:1}
 100%{transform:scale(1) translateY(0);box-shadow:none}
}

/* ===== Navegación ===== */
.nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px;font-family:var(--px);font-size:10px;color:#d8d0bd;z-index:10}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.3;cursor:default}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}

/* ===== Modales ===== */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px;border-top:1px solid rgba(255,255,255,.1)}
.sheet-header{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;position:sticky;top:-24px;background:var(--bg);padding-top:4px;z-index:10;border-bottom:1px solid var(--ln);padding-bottom:12px}
.sheet h2{margin:0;font-size:22px;color:var(--tx)}
.search-input{width:100%;background:#1b1922;border:1px solid var(--ln);border-radius:10px;padding:12px 16px;color:#fff;font-family:inherit;font-size:14px;outline:none}
.search-input:focus{border-color:var(--ac)}
.sheet h3{font-size:12px;margin:18px 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{cursor:pointer;font-size:11px;color:var(--mu);text-align:center;transition:transform .15s}
.opt:hover{transform:translateY(-4px)}
.opt small{display:block;margin-top:6px;line-height:1.3}
.opt.sel .card{outline:4px solid var(--ac);outline-offset:2px;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.acts{display:flex;gap:10px;margin-top:20px}
.msg{padding:30px 0;text-align:center;color:var(--mu);font-size:14px}

/* ===== Inspector 3D ===== */
.inspector-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
.inspector-overlay.open{display:flex}
.inspector-card-wrapper{width:min(80vw,360px);aspect-ratio:5/7;perspective:1000px;cursor:grab}
.inspector-card-wrapper:active{cursor:grabbing}
.inspector-details{margin-top:24px;color:#fff;font-family:var(--px);font-size:12px;text-align:center}
.inspector-details small{display:block;margin-top:8px;font-family:system-ui;color:var(--mu);font-size:14px}
</style></head><body>

<!-- Tapete Negro -->
<div class="playmat-table"><div class="playmat"><div class="playmat-logo"></div></div></div>

<!-- HUD Balance y Utilidades -->
<div class="hud-panel">
 <div class="hud-title"><span>Colección TCG</span><div class="hud-led"></div></div>
 <div class="hud-val" id="sv">0,00 €</div>
 <div class="hud-sub">
  <span id="sc">0 de 151 cartas</span>
  <span id="sp">0%</span>
 </div>
 <div class="hud-bar"><i id="sb"></i></div>

 <div class="hud-section">Medallas Kanto</div>
 <div class="badges-container">
  <span class="badge-icon" id="b1" title="Medalla Roca (20 cartas)">🪨</span>
  <span class="badge-icon" id="b2" title="Medalla Cascada (40 cartas)">💧</span>

  <span class="badge-icon" id="b4" title="Medalla Arcoíris (80 cartas)">🌈</span>

 </div>

 <div class="hud-section">Ir a Pokémon</div>
 <input type="text" class="hud-input" id="pokedexSearch" placeholder="🔍 Buscar por nombre o nº..." autocomplete="off">
 <div class="search-results" id="searchResults"></div>

 <div class="filter-bar">
  <button class="filter-btn active" id="fAll">Todas</button>
  <button class="filter-btn" id="fOwned">Tengo</button>
  <button class="filter-btn" id="fEmpty">Falta</button>
 </div>
 
 <div class="hud-section">Gestión</div>
 <div class="hud-actions">
  <button class="hud-btn" id="exportBtn">Exportar</button>
  <button class="hud-btn" id="importBtn">Importar</button>
  <button class="hud-btn" id="shareLinkBtn">Copiar Link</button>

 </div>
 
 <div class="hud-section">Estilo Binder</div>
 <select class="hud-select" id="themeSelect">
  <option value="theme-red">Pokéball Clásica</option>
  <option value="theme-ultra">Ultra Ball</option>

 </select>
</div>

<div class="scene" id="scene"><div class="book" id="book"></div></div>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<!-- Inspector 3D Flotante -->
<div class="inspector-overlay" id="inspector">
 <div class="inspector-card-wrapper" id="insCard"></div>
 <div class="inspector-details" id="insText"></div>
 <button class="btn ghost" style="margin-top:20px;color:#fff;border-color:#fff" id="closeIns">Cerrar Inspector</button>
</div>

<script>
/* ===== Audio Web Audio API ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }

function playFlipSound(){
 initAudio();
 const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
 osc.type = 'sine';
 osc.frequency.setValueAtTime(120, audioCtx.currentTime);
 osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
 gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
 osc.connect(gain); gain.connect(audioCtx.destination);
 osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}

function playPlaceSound(){
 initAudio();
 const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
 osc.type = 'triangle';
 osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
 osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
 gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
 osc.connect(gain); gain.connect(audioCtx.destination);
 osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

function playRemoveSound(){
 initAudio();
 const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
 osc.type = 'sawtooth';
 osc.frequency.setValueAtTime(300, audioCtx.currentTime);
 osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.1);
 gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
 osc.connect(gain); gain.connect(audioCtx.destination);
 osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

/* ===== Configuración ===== */
const API="https://api.pokemontcg.io/v2";
const API_KEY="";
const SPRITE=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/firered-leafgreen/${n}.png`;
const STORE="pk_album_gen1";

const NAMES="Bulbasaur,Ivysaur,Venusaur,Charmander,Charmeleon,Charizard,Squirtle,Wartortle,Blastoise,Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,Ekans,Arbok,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran♀,Nidorina,Nidoqueen,Nidoran♂,Nidorino,Nidoking,Clefairy,Clefable,Vulpix,Ninetales,Jigglypuff,Wigglytuff,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,Tentacruel,Geodude,Graveler,Golem,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,Chansey,Tangela,Kangaskhan,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx,Electabuzz,Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew".split(",");
const N=NAMES.length,PER=9,PAGES=Math.ceil(N/PER),S=Math.ceil(PAGES/2);
const ORDER=["Common","Uncommon","Rare","Rare Holo","Rare Holo EX","Rare Holo GX","Rare Holo V","Rare Holo VMAX","Rare Holo VSTAR","Double Rare","Ultra Rare","Illustration Rare","Special Illustration Rare","Hyper Rare","Rare Secret","Rare Rainbow","Promo"];
const isHolo=r=>!/^(Common|Uncommon|Rare|Promo|Sin rareza)$/.test(r);
const eur=v=>v.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
let picks={},s=0,currentFilter="all";const cache={};

const urlParams = new URLSearchParams(window.location.search);
const sharedData = urlParams.get("col");
if(sharedData){
 try{ picks = JSON.parse(atob(sharedData)); }catch(e){}
}
if(Object.keys(picks).length===0){
 try{picks=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){}
}

const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(picks))}catch(e){}};

async function loadCards(n){
 if(cache[n])return cache[n];let all=[],pg=1,total=1;
 while(all.length<total&&pg<=4){
  const u=`${API}/cards?q=${encodeURIComponent("nationalPokedexNumbers:"+n)}&pageSize=250&page=${pg}&select=id,name,rarity,images,set,number,cardmarket`;
  const r=await fetch(u,API_KEY?{headers:{"X-Api-Key":API_KEY}}:undefined);
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();total=j.totalCount;all=all.concat(j.data);pg++}
 return cache[n]=all.map(c=>{const p=c.cardmarket&&c.cardmarket.prices;
  return{id:c.id,name:c.name,rarity:c.rarity||"Sin rareza",img:c.images.small,set:c.set.name,number:c.number,price:+((p&&(p.trendPrice??p.averageSellPrice))||0)}})}

const cardHTML=c=>`<div class="card ${isHolo(c.rarity)?"holo":""}"><img src="${c.img}" alt="${c.name}" loading="lazy"><div class="shine"></div></div>`;
const pgFace=(p,cls)=>`<div class="fc ${cls}"><div class="pgi"><div class="g" id="g${p}"></div><div class="ft">Página ${p+1} de ${PAGES}</div></div></div>`;

const faces=[
 `<div class="fc cover fr theme-red" id="cv"><div class="ball"></div><div class="cover-badge">KANTO GEN I</div><b>POKÉDEX</b><b>ÁLBUM TCG</b><small>TOCA PARA ABRIR</small></div>`,
 pgFace(0,"bk")
];
for(let p=1;p<PAGES;p++)faces.push(pgFace(p,(p%2===1)?"fr":"bk"));
while(faces.length<2*(S+1))faces.push(`<div class="fc bk st"><div class="pgi"><h2>FIN</h2><p>Primera generación completada.</p></div></div>`);

const book=document.getElementById("book");
book.innerHTML=Array.from({length:S+1},(_,i)=>`<div class="sh" style="--i:${i};--n:${S+1}">${faces[2*i]}${faces[2*i+1]}</div>`).join("");
const sh=[...book.children];

function fill(animNum=null){
 for(let p=0;p<PAGES;p++){let h="";
  for(let j=0;j<PER;j++){const n=p*PER+j+1;if(n>N)break;const pk=picks[n];
   const isJustPlaced = animNum === n ? "just-placed" : "";
   
   if(currentFilter==="owned" && !pk){
    h+=`<div class="slot" style="visibility:hidden"></div>`;
   }else if(currentFilter==="empty" && pk){
    h+=`<div class="slot" style="visibility:hidden"></div>`;
   }else{
    h+=pk?`<button class="slot ${isJustPlaced}" style="--j:${j}" data-n="${n}">${cardHTML(pk)}</button>`
    :`<button class="slot e" style="--j:${j}" data-n="${n}"><span class="nn">#${String(n).padStart(3,"0")}</span><img class="sp" src="${SPRITE(n)}" alt="${NAMES[n-1]}" loading="lazy"><span class="nm">${NAMES[n-1]}</span></button>`;
   }
  }
  document.getElementById("g"+p).innerHTML=h}
 let t=0,c=0;for(const n in picks){t+=picks[n].price;c++}
 const pct = Math.round((c/N)*100);
 document.getElementById("sv").textContent=eur(t);
 document.getElementById("sc").textContent=`${c} de ${N} cartas`;
 document.getElementById("sp").textContent=`${pct}%`;
 document.getElementById("sb").style.width=pct+"%";
 
 // Actualizar Medallas
 document.getElementById("b1").classList.toggle("active", c >= 20);
 document.getElementById("b2").classList.toggle("active", c >= 40);
 document.getElementById("b3").classList.toggle("active", c >= 60);
 document.getElementById("b4").classList.toggle("active", c >= 80);
 document.getElementById("b5").classList.toggle("active", c >= 100);
 document.getElementById("b6").classList.toggle("active", c >= 120);
 document.getElementById("b7").classList.toggle("active", c >= 140);
 document.getElementById("b8").classList.toggle("active", c >= 151);

 updateActiveFaces();
}

function updateActiveFaces(){
 sh.forEach((e,i)=>{
  e.classList.toggle("f", i < s);
  e.classList.toggle("active-left", i === s - 1);
  e.classList.toggle("active-right", i === s);
 });
}

function go(v, silent=false){
 if(!silent && s!==v) playFlipSound();
 s=Math.max(0,Math.min(S,v));
 if(s>0){ rotY=0; rotX=0; updateBookRotation(); }
 book.className="book"+(s===S?" end":s>0?" open":"");
 document.getElementById("prev").disabled=s===0;document.getElementById("next").disabled=s===S;
 document.getElementById("lb").textContent=s===0?"PORTADA":s===S?"FIN":`PÁGINAS ${s*2-1}-${s*2}`;
 updateActiveFaces();
}

/* Salto directo por búsqueda de Pokédex */
function jumpToPokemon(n){
 const pageIndex = Math.floor((n-1)/PER);
 const sheetIndex = Math.floor(pageIndex/2) + 1;
 go(sheetIndex);
}

const pokeInput = document.getElementById("pokedexSearch");
const pokeResults = document.getElementById("searchResults");

pokeInput.oninput = e => {
 const q = e.target.value.toLowerCase().trim();
 if(!q){ pokeResults.classList.remove("open"); return; }
 const matches = NAMES.map((name, i)=>({n: i+1, name})).filter(item => item.name.toLowerCase().includes(q) || item.n.toString() === q);
 if(matches.length === 0){ pokeResults.classList.remove("open"); return; }
 
 pokeResults.innerHTML = matches.slice(0, 8).map(m => `<div class="search-item" data-n="${m.n}"><span>#${String(m.n).padStart(3,"0")} ${m.name}</span><small>Pág. ${Math.floor((m.n-1)/PER)+1}</small></div>`).join("");
 pokeResults.classList.add("open");
};

pokeResults.onclick = e => {
 const item = e.target.closest(".search-item");
 if(!item) return;
 const n = +item.dataset.n;
 pokeInput.value = `#${String(n).padStart(3,"0")} ${NAMES[n-1]}`;
 pokeResults.classList.remove("open");
 jumpToPokemon(n);
};

/* Rotación 360° en Portada */
let isDragging=false, startX=0, startY=0, rotY=0, rotX=0;
const scene=document.getElementById("scene");

scene.addEventListener("pointerdown", e=>{
 if(s!==0 || e.target.closest("#cv")) return;
 isDragging=true; startX=e.clientX; startY=e.clientY;
});

window.addEventListener("pointermove", e=>{
 if(!isDragging || s!==0) return;
 const dx=e.clientX-startX, dy=e.clientY-startY;
 rotY += dx * 0.5; rotX -= dy * 0.5;
 rotX = Math.max(-60, Math.min(60, rotX));
 startX=e.clientX; startY=e.clientY;
 updateBookRotation();
});

window.addEventListener("pointerup", ()=>isDragging=false);

function updateBookRotation(){
 if(s===0){
  book.style.transform=`translateX(-50%) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
 }else{
  book.style.transform="";
 }
}

/* Modal y Búsqueda */
let currentCards=[];
async function openPoke(n){
 const o=document.getElementById("sheet");
 o.dataset.n=n;
 o.innerHTML=`<div class="sheet-header"><h2>#${n} ${NAMES[n-1]}</h2></div><div class="msg">Buscando cartas en la API...</div><div class="acts"><button class="btn ghost" id="cl">Cerrar</button></div>`;
 document.getElementById("ov").classList.add("open");document.getElementById("cl").onclick=close;
 
 try{currentCards=await loadCards(n)}catch(e){
  o.innerHTML=`<div class="sheet-header"><h2>#${n} ${NAMES[n-1]}</h2></div><div class="msg">Error al conectar con la API (${e.message}). Reinténtalo.</div><div class="acts"><button class="btn" id="rt">Reintentar</button><button class="btn ghost" id="cl">Cerrar</button></div>`;
  document.getElementById("rt").onclick=()=>openPoke(n);document.getElementById("cl").onclick=close;return}
 
 renderCards(n,"");
}

function renderCards(n,filterText){
 const o=document.getElementById("sheet");
 const query=filterText.toLowerCase().trim();
 const filtered=currentCards.filter(c=>c.set.toLowerCase().includes(query)||c.rarity.toLowerCase().includes(query)||(c.number&&c.number.toString().includes(query)));
 
 const rk=r=>{const i=ORDER.indexOf(r);return i<0?99:i};
 const gr={};filtered.forEach(c=>(gr[c.rarity]=gr[c.rarity]||[]).push(c));
 
 let h=`<div class="sheet-header">
  <h2>#${n} ${NAMES[n-1]}</h2>
  <input type="text" class="search-input" id="cardSearch" placeholder="🔍 Buscar por expansión o rareza..." value="${filterText}">
 </div>`;
 
 if(filtered.length===0){
  h+=`<div class="msg">No se encontraron cartas que coincidan con "${filterText}".</div>`;
 }else{
  Object.keys(gr).sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b)).forEach(r=>{
   h+=`<h3>${r} (${gr[r].length})</h3><div class="cg">`+gr[r].map(c=>`<div class="opt ${picks[n]&&picks[n].id===c.id?"sel":""}" data-id="${c.id}">${cardHTML(c)}<small><b>${c.set}</b><br>${c.price?eur(c.price):"Sin precio"}</small></div>`).join("")+`</div>`});
 }
 
 h+=`<div class="acts">${picks[n]?'<button class="btn ghost" id="inspectBtn">🔍 Inspeccionar</button><button class="btn ghost" id="rm">Quitar carta</button>':""}<button class="btn ghost" id="cl">Cerrar</button></div>`;
 o.innerHTML=h;
 
 document.getElementById("cl").onclick=close;
 const rm=document.getElementById("rm");if(rm)rm.onclick=()=>{delete picks[n];playRemoveSound();save();close();fill()};
 const ins=document.getElementById("inspectBtn");if(ins)ins.onclick=()=>{close();openInspector(picks[n]);};
 
 const searchEl=document.getElementById("cardSearch");
 searchEl.focus();
 searchEl.setSelectionRange(searchEl.value.length, searchEl.value.length);
 searchEl.oninput=e=>renderCards(n,e.target.value);
}

const close=()=>document.getElementById("ov").classList.remove("open");

/* Inspector 3D */
function openInspector(card){
 const ins = document.getElementById("inspector");
 const insCard = document.getElementById("insCard");
 const insText = document.getElementById("insText");
 insCard.innerHTML = cardHTML(card);
 insText.innerHTML = `${card.name} <small>${card.set} • ${card.rarity} • ${card.price?eur(card.price):"Sin precio"}</small>`;
 ins.classList.add("open");
}
document.getElementById("closeIns").onclick=()=>document.getElementById("inspector").classList.remove("open");

/* Filtros */
const setFilter=(f, btn)=>{
 currentFilter = f;
 document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 fill();
};
document.getElementById('fAll').onclick=e=>setFilter('all',e.target);
document.getElementById('fOwned').onclick=e=>setFilter('owned',e.target);
document.getElementById('fEmpty').onclick=e=>setFilter('empty',e.target);

/* HUD Tools */
document.getElementById("exportBtn").onclick=()=>{
 const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(picks, null, 2));
 const dlAnchor = document.createElement('a');
 dlAnchor.setAttribute("href", dataStr);
 dlAnchor.setAttribute("download", `pokedex_tcg_coleccion.json`);
 document.body.appendChild(dlAnchor);
 dlAnchor.click();
 dlAnchor.remove();
};

document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
 const file = e.target.files[0];
 if(!file) return;
 const reader = new FileReader();
 reader.onload=evt=>{
  try{
   picks = JSON.parse(evt.target.result);
   save(); fill();
   alert("¡Colección cargada con éxito!");
  }catch(err){ alert("Archivo JSON no válido."); }
 };
 reader.readAsText(file);
};

document.getElementById("shareLinkBtn").onclick=()=>{
 const code = btoa(JSON.stringify(picks));
 const shareUrl = `${window.location.origin}${window.location.pathname}?col=${code}`;
 navigator.clipboard.writeText(shareUrl).then(()=>{
  alert("¡Enlace copiado al portapapeles! Puedes enviárselo a quien quieras.");
 });
};

document.getElementById("refreshPricesBtn").onclick=async ()=>{
 const btn = document.getElementById("refreshPricesBtn");
 btn.textContent = "Cargando...";
 for(let n in picks){
  try{
   const cards = await loadCards(+n);
   const updated = cards.find(c=>c.id === picks[n].id);
   if(updated) picks[n].price = updated.price;
  }catch(e){}
 }
 save(); fill();
 btn.textContent = "Precios ↻";
 alert("¡Precios actualizados con éxito!");
};

document.getElementById("themeSelect").onchange=e=>{
 const cover = document.getElementById("cv");
 cover.className = `fc cover fr ${e.target.value}`;
};

/* Interacción */
book.addEventListener("click",e=>{
 if(e.target.closest("#cv")){go(1);return}
 const b=e.target.closest(".slot");
 if(b && b.dataset.n) openPoke(+b.dataset.n);
});

document.getElementById("sheet").addEventListener("click",e=>{const op=e.target.closest(".opt");if(!op || !op.dataset.id)return;
 const n=+document.getElementById("sheet").dataset.n,c=cache[n]&&cache[n].find(x=>x.id===op.dataset.id);
 if(c){picks[n]=c;playPlaceSound();save();close();fill(n)}});

document.getElementById("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
document.getElementById("prev").onclick=()=>go(s-1);
document.getElementById("next").onclick=()=>go(s+1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(s+1);if(e.key==="ArrowLeft")go(s-1)});

/* Efecto Holográfico */
function setHoloTransform(card, x, y){
 card.style.setProperty("--mx", x*100+"%");
 card.style.setProperty("--my", y*100+"%");
 card.style.transform=`perspective(600px) rotateY(${(x-.5)*24}deg) rotateX(${(.5-y)*24}deg)`;
 card.classList.add("on");
}

document.addEventListener("pointermove",e=>{
 const c=e.target.closest&&e.target.closest(".card.holo, .inspector-card-wrapper .card");if(!c)return;
 const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
 setHoloTransform(c, x, y);
});

document.addEventListener("pointerout",e=>{
 const c=e.target.closest&&e.target.closest(".card.holo, .inspector-card-wrapper .card");
 if(c&&!c.contains(e.relatedTarget)){c.style.transform="";c.classList.remove("on")}
});

if (window.DeviceOrientationEvent) {
 window.addEventListener('deviceorientation', e => {
  const cards = document.querySelectorAll('.card.holo');
  if(!cards.length) return;
  const x = Math.min(Math.max((e.gamma || 0) + 20, 0), 40) / 40;
  const y = Math.min(Math.max((e.beta || 0) - 20, 0), 40) / 40;
  cards.forEach(c => setHoloTransform(c, x, y));
 });
}

fill();go(0, true);
</script></body></html>
