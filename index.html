<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Álbum Pokédex TCG 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#0e0e11;--pp:#fbf7ec;--tx:#1c1b22;--mu:#6b6878;--ln:#d8d0bd;--ac:#d6372b;--px:"Press Start 2P",ui-monospace,monospace;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--pp:#22202a;--tx:#f1eff6;--mu:#a09cb0;--ln:#3a3846;--ac:#ff5a4d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:#08080a;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}

/* Tapete */
.playmat-table{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#181820 0%,#040406 100%);display:flex;align-items:center;justify-content:center;z-index:-1;overflow:hidden}
.playmat{width:min(96vw,1300px);height:min(88vh,860px);background:#121216;border-radius:28px;border:8px solid #0a0a0d;box-shadow:inset 0 0 90px rgba(0,0,0,.95),0 25px 60px rgba(0,0,0,.9);position:relative;display:flex;align-items:center;justify-content:center}
.playmat::before{content:"";position:absolute;inset:16px;border:2px dashed rgba(255,255,255,.06);border-radius:20px;pointer-events:none}

/* HUD Lateral */
.hud-panel{position:fixed;top:20px;left:20px;background:rgba(18,18,22,.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px 22px;color:#fff;z-index:20;box-shadow:0 12px 35px rgba(0,0,0,.6);min-width:255px}
.hud-title{font-family:var(--px);font-size:9px;color:var(--mu);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.hud-led{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.hud-val{font-family:var(--px);font-size:18px;color:#4ade80;margin-bottom:8px}
.hud-sub{font-size:12px;color:#a09cb0;margin-bottom:8px;display:flex;justify-content:space-between}
.hud-bar{height:8px;background:#2a2833;border-radius:6px;overflow:hidden;margin-bottom:14px}.hud-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a4d,#4ade80);transition:width .6s}
.hud-section{font-size:10px;color:var(--mu);margin:10px 0 6px;font-family:var(--px);text-transform:uppercase}
.hud-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.hud-btn{background:#262430;color:#d8d0bd;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 8px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.hud-btn:hover{background:#3a3846;color:#fff;border-color:var(--ac)}
.hud-select, .hud-input{width:100%;background:#262430;color:#d8d0bd;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;outline:none;margin-bottom:6px}
.hud-input:focus{border-color:var(--ac);color:#fff}

.search-results{background:#1b1922;border:1px solid rgba(255,255,255,.15);border-radius:8px;max-height:160px;overflow-y:auto;display:none;margin-bottom:8px}
.search-results.open{display:block}
.search-item{padding:8px 12px;font-size:11px;color:#d8d0bd;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.search-item:hover{background:var(--ac);color:#fff}

/* Escena y Álbum 3D */
.scene{--pw:min(42vw,440px);perspective:2200px;padding:10px 0;display:flex;justify-content:center;align-items:center;width:100%;cursor:grab}
.scene:active{cursor:grabbing}
.book{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)*1.42);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.1,.2,1);transform:translateX(calc(var(--pw)*-.5))}
.book.open{transform:none!important}

.sh{position:absolute;left:50%;top:0;width:var(--pw);height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.1,.2,1);pointer-events:none;z-index:1}
.sh.f{transform:rotateY(-180deg)}
.sh:not(.f){transform:rotateY(0deg)}

.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--pp);overflow:hidden;pointer-events:none!important}
.fr{border-radius:2px 10px 10px 2px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset 12px 0 16px -8px rgba(0,0,0,.35);z-index:2}
.bk{transform:rotateY(180deg);border-radius:10px 2px 2px 10px;box-shadow:0 10px 30px rgba(0,0,0,.45),inset -12px 0 16px -8px rgba(0,0,0,.35);z-index:1}

.sh.active-left .bk{pointer-events:auto!important;z-index:10}
.sh.active-right .fr{pointer-events:auto!important;z-index:10}
.sh.active-left .bk *, .sh.active-right .fr *{pointer-events:auto!important}

/* Portada y Lomo */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:var(--px);text-align:center;cursor:pointer;pointer-events:auto!important;transition:all .3s;box-shadow:inset 0 0 30px rgba(0,0,0,.6),0 15px 40px rgba(0,0,0,.6);position:relative;padding:20px;height:100%}
.cover::before{content:"";position:absolute;inset:10px;border:2px double rgba(246,211,107,.4);border-radius:8px;pointer-events:none}
.cover h1{font-size:20px;margin:0;line-height:1.3;color:#f6d36b}
.cover small{font-size:10px;animation:bl 1.4s steps(2) infinite;letter-spacing:1px;margin-top:8px;color:#f6d36b}
@keyframes bl{50%{opacity:.2}}
.cover-badge{background:rgba(0,0,0,.4);border:1.5px solid #f6d36b;padding:4px 12px;border-radius:14px;color:#f6d36b;font-size:9px}

.theme-red{background:linear-gradient(135deg,#b02418,#6e1008);border:4px solid #420804}
.theme-red .ball{border-color:#111;background:linear-gradient(#e63b2e 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 20px rgba(230,59,46,.5),0 0 0 5px #f6d36b}
.theme-ultra{background:linear-gradient(135deg,#233342,#111a22);border:4px solid #090e13}
.theme-ultra .ball{border-color:#111;background:linear-gradient(#f39c12 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 20px rgba(243,156,18,.5),0 0 0 5px #f1c40f}
.theme-master{background:linear-gradient(135deg,#73318f,#401b50);border:4px solid #230d2d}
.theme-master .ball{border-color:#111;background:linear-gradient(#9b59b6 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 20px rgba(155,89,182,.5),0 0 0 5px #e84393}
.theme-leather{background:linear-gradient(135deg,#2e1a0e,#190d07);border:4px solid #0b0503}
.theme-leather .ball{border-color:#111;background:linear-gradient(#d4af37 0 45%,#111 45% 55%,#222 55%);box-shadow:0 0 20px rgba(212,175,55,.5),0 0 0 5px #d4af37}

.ball{width:90px;height:90px;border-radius:50%;border:5px solid #111;position:relative}
.ball::after{content:"";position:absolute;inset:50% auto auto 50%;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;border:4px solid #111}

.pgi{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ft{margin-top:auto;text-align:center;font-family:var(--px);font-size:9px;color:var(--mu)}

/* Huecos Vacíos en Gris Neutral */
.slot{aspect-ratio:5/7;border-radius:8px;border:0;padding:0;cursor:pointer;background:none;font-family:inherit;display:block;width:100%;position:relative}
.slot.e{background:#2b2933;border:2px dashed #484556;color:#8e8a9f;font-family:var(--px);display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:6px;transition:all .15s}
.slot.e:hover{transform:translateY(-3px);background:#35333f;border-color:#68637c;color:#c0bbd4}
.slot .nn{font-size:9px;align-self:flex-start;margin-left:4px;opacity:0.7}
.slot img.sp{width:70%;flex:1;min-height:0;object-fit:contain;image-rendering:pixelated;opacity:0.55;filter:grayscale(0.4)}
.slot.e:hover img.sp{opacity:0.95;filter:none}
.slot .nm{font-size:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0.8}

/* Cartas y Sleeves Protectoras */
.card{position:relative;width:100%;aspect-ratio:5/7;border-radius:4.5%;overflow:hidden;background:#0002;transition:all .2s}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.shine{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(115deg,transparent 15%,rgba(255,0,128,.5),rgba(0,255,220,.5),rgba(255,230,0,.5),transparent 85%);background-size:250% 250%;mix-blend-mode:soft-light}
.holo .shine{opacity:.5}.holo.on .shine{opacity:1}

/* Funda Protectora Sleeve Premium */
.has-sleeve .card{outline:3px solid #f6d36b;outline-offset:-1px;box-shadow:0 0 15px rgba(246,211,107,.6);transform:scale(1.02)}
.has-sleeve::before{content:"⭐ SLEEVE";position:absolute;top:4px;right:4px;background:#f6d36b;color:#000;font-family:var(--px);font-size:6px;padding:2px 4px;border-radius:4px;z-index:5;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,.5)}

/* Nav & Modals */
.nav{display:flex;justify-content:center;align-items:center;gap:16px;padding:10px;font-family:var(--px);font-size:10px;color:#d8d0bd;z-index:10}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.3;cursor:default}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--ln);box-shadow:none}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px;border-top:1px solid rgba(255,255,255,.1)}
.sheet-header{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;position:sticky;top:-24px;background:var(--bg);padding-top:4px;z-index:10;border-bottom:1px solid var(--ln);padding-bottom:12px}
.sheet h2{margin:0;font-size:22px;color:var(--tx)}
.search-input{width:100%;background:#1b1922;border:1px solid var(--ln);border-radius:10px;padding:12px 16px;color:#fff;font-family:inherit;font-size:14px;outline:none}
.search-input:focus{border-color:var(--ac)}
.sheet h3{font-size:12px;margin:18px 0 10px;color:var(--mu);text-transform:uppercase}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{cursor:pointer;font-size:11px;color:var(--mu);text-align:center;transition:transform .15s}
.opt:hover{transform:translateY(-4px)}
.opt small{display:block;margin-top:6px;line-height:1.3}
.opt.sel .card{outline:4px solid var(--ac);outline-offset:2px}
.acts{display:flex;gap:10px;margin-top:20px}
.msg{padding:30px 0;text-align:center;color:var(--mu);font-size:14px}

/* Inspector 3D y Gráfico de Precios */
.inspector-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.inspector-overlay.open{display:flex}
.inspector-container{display:flex;gap:30px;max-width:850px;width:100%;background:#181720;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.8);align-items:center}
.inspector-card-wrapper{width:260px;aspect-ratio:5/7;flex-shrink:0}
.inspector-info{flex:1;color:#fff;display:flex;flex-direction:column;gap:12px}
.inspector-info h2{margin:0;font-family:var(--px);font-size:16px;color:#f6d36b}
.inspector-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;background:#2b2838;color:#4ade80;font-weight:bold;margin-bottom:6px}
.chart-container{background:#111017;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-top:6px}
.chart-title{font-size:10px;font-family:var(--px);color:var(--mu);margin-bottom:8px}
canvas#priceChart{width:100%;height:140px}
</style>
</head>
<body>

<div class="playmat-table"><div class="playmat"></div></div>

<div class="hud-panel">
 <div class="hud-title"><span>Colección TCG</span><div class="hud-led"></div></div>
 <div class="hud-val" id="sv">0,00 €</div>
 <div class="hud-sub"><span id="sc">0 de 151 cartas</span><span id="sp">0%</span></div>
 <div class="hud-bar"><i id="sb"></i></div>

 <div class="hud-section">Ir a Pokémon</div>
 <input type="text" class="hud-input" id="pokedexSearch" placeholder="🔍 Buscar por nombre o nº..." autocomplete="off">
 <div class="search-results" id="searchResults"></div>

 <div class="hud-section">Filtrar por Set</div>
 <select class="hud-select" id="setFilterSelect">
  <option value="ALL">Todos los Sets</option>
 </select>

 <div class="hud-section">Gestión</div>
 <div class="hud-actions">
  <button class="hud-btn" id="exportBtn">JSON Export</button>
  <button class="hud-btn" id="exportPdfBtn">📄 PDF Report</button>
  <button class="hud-btn" id="importBtn">Importar</button>
  <button class="hud-btn" id="shareLinkBtn">Copiar Link</button>
  <button class="hud-btn" id="refreshPricesBtn" style="grid-column:span 2">Precios ↻</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
 </div>
 
 <div class="hud-section">Estilo Binder</div>
 <select class="hud-select" id="themeSelect">
  <option value="theme-red">Pokéball Clásica</option>
  <option value="theme-ultra">Ultra Ball</option>
  <option value="theme-master">Master Ball</option>
  <option value="theme-leather">Cuero Coleccionista</option>
 </select>
</div>

<div class="scene" id="scene"><div class="book" id="book"></div></div>
<div class="nav"><button class="btn" id="prev">‹ Anterior</button><span id="lb">PORTADA</span><button class="btn" id="next">Siguiente ›</button></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<!-- Inspector Detallado de Carta -->
<div class="inspector-overlay" id="inspector">
 <div class="inspector-container">
  <div class="inspector-card-wrapper" id="insCard"></div>
  <div class="inspector-info">
   <h2 id="insTitle">Charizard</h2>
   <div><span class="inspector-badge" id="insRarity">Rare Holo</span></div>
   <div style="font-size:13px;color:#a09cb0;" id="insSet">Base Set • Nº 4/102</div>
   <div style="font-size:18px;font-weight:bold;color:#4ade80;margin-top:4px;" id="insPrice">45,00 €</div>
   
   <div class="chart-container">
    <div class="chart-title">EVOLUCIÓN DE PRECIO (ÚLTIMOS 6 MESES)</div>
    <canvas id="priceChart"></canvas>
   </div>
   
   <div style="display:flex;gap:10px;margin-top:10px">
    <button class="btn" style="background:#f6d36b;color:#000;font-family:var(--px);font-size:10px" id="toggleSleeveBtn">⭐ MARCAR SLEEVE</button>
    <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.2)" id="closeIns">Cerrar</button>
   </div>
  </div>
 </div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio(){ if(!audioCtx) audioCtx = new AudioCtx(); }
function playFlipSound(){
 initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
 osc.type = 'sine'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
 osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
 gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
 osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.12);
}
function playPlaceSound(){
 initAudio(); const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
 osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
 osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
 gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
 osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.25);
}

const API="https://api.pokemontcg.io/v2", STORE="pk_album_gen1";
const SPRITE=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iii/firered-leafgreen/${n}.png`;
const NAMES="Bulbasaur,Ivysaur,Venusaur,Charmander,Charmeleon,Charizard,Squirtle,Wartortle,Blastoise,Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,Ekans,Arbok,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran♀,Nidorina,Nidoqueen,Nidoran♂,Nidorino,Nidoking,Clefairy,Clefable,Vulpix,Ninetales,Jigglypuff,Wigglytuff,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,Tentacruel,Geodude,Graveler,Golem,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,Chansey,Tangela,Kangaskhan,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx,Electabuzz,Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew".split(",");
const N=NAMES.length, PER=9, TOTAL_PAGES=Math.ceil(N/PER), S=Math.ceil(TOTAL_PAGES/2);
const isHolo=r=>!/^(Common|Uncommon|Rare|Promo|Sin rareza)$/.test(r);
const eur=v=>v.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
let picks={}, s=0, selectedSetFilter="ALL"; const cache={};

try{picks=JSON.parse(localStorage.getItem(STORE)||"{}")||{}}catch(e){}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(picks))}catch(e){}};

async function loadCards(n){
 if(cache[n])return cache[n]; let all=[],pg=1,total=1;
 while(all.length<total&&pg<=4){
  const r=await fetch(`${API}/cards?q=${encodeURIComponent("nationalPokedexNumbers:"+n)}&pageSize=250&page=${pg}`);
  if(!r.ok)break; const j=await r.json(); total=j.totalCount; all=all.concat(j.data); pg++;
 }
 return cache[n]=all.map(c=>{const p=c.cardmarket&&c.cardmarket.prices; return{id:c.id,name:c.name,rarity:c.rarity||"Sin rareza",img:c.images.small,set:c.set.name,number:c.number,price:+((p&&(p.trendPrice??p.averageSellPrice))||0)}});
}

const cardHTML=c=>`<div class="card ${isHolo(c.rarity)?"holo":""}"><img src="${c.img}" alt="${c.name}"><div class="shine"></div></div>`;
const pgFace=(p,cls)=>`<div class="fc ${cls}"><div class="pgi"><div class="g" id="g${p}"></div><div class="ft">Página ${p+1} de ${TOTAL_PAGES}</div></div></div>`;

const faces=[
 `<div class="fc cover fr theme-red" id="cv"><div class="ball"></div><div class="cover-badge">KANTO GEN I</div><h1>POKÉDEX<br>TCG</h1><small>TOCA PARA ABRIR</small></div>`,
 pgFace(0,"bk")
];
for(let p=1; p<TOTAL_PAGES; p++){
 faces.push(pgFace(p, (p%2===1)?"fr":"bk"));
}
while(faces.length < 2*(S+1)){
 faces.push(`<div class="fc bk"><div class="pgi"><h2>FIN</h2></div></div>`);
}

const book=document.getElementById("book");
book.innerHTML=Array.from({length:S+1},(_,i)=>`<div class="sh" style="z-index:${S+1-i}">${faces[2*i]}${faces[2*i+1]}</div>`).join("");
const sh=[...book.children];

function updateSetDropdown(){
 const setSelect = document.getElementById("setFilterSelect");
 const sets = new Set();
 for(let n in picks){ if(picks[n].set) sets.add(picks[n].set); }
 setSelect.innerHTML = `<option value="ALL">Todos los Sets (${sets.size})</option>` + 
  Array.from(sets).sort().map(s=>`<option value="${s}" ${selectedSetFilter===s?"selected":""}>${s}</option>`).join("");
}

function fill(){
 for(let p=0; p<TOTAL_PAGES; p++){
  let h="";
  for(let j=0; j<PER; j++){
   const n=p*PER+j+1; if(n>N)break; const pk=picks[n];
   
   if(pk){
    const matchesSet = selectedSetFilter === "ALL" || pk.set === selectedSetFilter;
    const sleeveClass = pk.sleeve ? "has-sleeve" : "";
    const opacityStyle = matchesSet ? "" : "opacity:0.25;filter:grayscale(0.8);";
    h+=`<button class="slot ${sleeveClass}" style="${opacityStyle}" data-n="${n}">${cardHTML(pk)}</button>`;
   }else{
    h+=`<button class="slot e" data-n="${n}"><span class="nn">#${String(n).padStart(3,"0")}</span><img class="sp" src="${SPRITE(n)}"><span class="nm">${NAMES[n-1]}</span></button>`;
   }
  }
  const el = document.getElementById("g"+p);
  if(el) el.innerHTML=h;
 }
 let t=0,c=0; for(const n in picks){t+=picks[n].price;c++}
 const pct = Math.round((c/N)*100);
 document.getElementById("sv").textContent=eur(t);
 document.getElementById("sc").textContent=`${c} de ${N} cartas`;
 document.getElementById("sp").textContent=`${pct}%`;
 document.getElementById("sb").style.width=pct+"%";
 updateSetDropdown();
 updateActiveFaces();
}

function updateActiveFaces(){
 sh.forEach((e,i)=>{
  if(i < s){
   e.className="sh f";
   e.style.zIndex=i+1;
  }else{
   e.className="sh";
   e.style.zIndex=S+1-i;
  }
  e.classList.toggle("active-left", i === s - 1);
  e.classList.toggle("active-right", i === s);
 });
}

function go(v, silent=false){
 if(!silent && s!==v) playFlipSound();
 s=Math.max(0,Math.min(S,v));
 if(s>0){ rotY=0; rotX=0; updateBookRotation(); }
 book.className="book"+(s>0?" open":"");
 document.getElementById("prev").disabled=s===0;
 document.getElementById("next").disabled=s===S;
 
 if(s===0){
  document.getElementById("lb").textContent="PORTADA";
 }else{
  const p1 = s*2 - 1, p2 = s*2;
  document.getElementById("lb").textContent = p2 <= TOTAL_PAGES ? `PÁGS ${p1}-${p2}` : `PÁG ${p1}`;
 }
 updateActiveFaces();
}

/* Rotación 360 */
let isDragging=false, startX=0, startY=0, rotY=0, rotX=0;
const scene=document.getElementById("scene");
scene.addEventListener("pointerdown", e=>{
 if(s!==0 || e.target.closest("#cv")) return;
 isDragging=true; startX=e.clientX; startY=e.clientY;
});
window.addEventListener("pointermove", e=>{
 if(!isDragging || s!==0) return;
 const dx=e.clientX-startX, dy=e.clientY-startY;
 rotY += dx * 0.5; rotX -= dy * 0.5;
 rotX = Math.max(-40, Math.min(40, rotX));
 startX=e.clientX; startY=e.clientY;
 updateBookRotation();
});
window.addEventListener("pointerup", ()=>isDragging=false);

function updateBookRotation(){
 if(s===0){
  book.style.transform=`translateX(-50%) rotateY(${rotY}deg) rotateX(${rotX}deg)`;
 }else{
  book.style.transform="";
 }
}

/* Buscador */
const pokeInput = document.getElementById("pokedexSearch"), pokeResults = document.getElementById("searchResults");
pokeInput.oninput = e => {
 const q = e.target.value.toLowerCase().trim();
 if(!q){ pokeResults.classList.remove("open"); return; }
 const matches = NAMES.map((name, i)=>({n: i+1, name})).filter(item => item.name.toLowerCase().includes(q) || item.n.toString() === q);
 if(!matches.length){ pokeResults.classList.remove("open"); return; }
 pokeResults.innerHTML = matches.slice(0,8).map(m => `<div class="search-item" data-n="${m.n}"><span>#${String(m.n).padStart(3,"0")} ${m.name}</span><small>Pág. ${Math.floor((m.n-1)/PER)+1}</small></div>`).join("");
 pokeResults.classList.add("open");
};
pokeResults.onclick = e => {
 const item = e.target.closest(".search-item"); if(!item) return;
 const n = +item.dataset.n;
 pokeInput.value = `#${String(n).padStart(3,"0")} ${NAMES[n-1]}`;
 pokeResults.classList.remove("open");
 go(Math.floor((Math.floor((n-1)/PER) + 1)/2));
};

/* Modal */
let currentCards=[];
async function openPoke(n){
 const o=document.getElementById("sheet"); o.dataset.n=n;
 o.innerHTML=`<div class="sheet-header"><h2>#${n} ${NAMES[n-1]}</h2></div><div class="msg">Cargando cartas TCG...</div>`;
 document.getElementById("ov").classList.add("open");
 try{currentCards=await loadCards(n)}catch(e){}
 renderCards(n,"");
}

function renderCards(n,filterText){
 const o=document.getElementById("sheet");
 const query=filterText.toLowerCase().trim();
 const filtered=currentCards.filter(c=>c.set.toLowerCase().includes(query)||c.rarity.toLowerCase().includes(query));
 let h=`<div class="sheet-header"><h2>#${n} ${NAMES[n-1]}</h2><input type="text" class="search-input" id="cardSearch" placeholder="🔍 Filtrar rareza/set..." value="${filterText}"></div><div class="cg">`;
 filtered.forEach(c=>{
  h+=`<div class="opt ${picks[n]&&picks[n].id===c.id?"sel":""}" data-id="${c.id}">${cardHTML(c)}<small><b>${c.set}</b><br>${eur(c.price)}</small></div>`;
 });
 h+=`</div><div class="acts">${picks[n]?'<button class="btn ghost" id="insBtn">🔍 Inspeccionar</button><button class="btn ghost" id="rm">Quitar</button>':""}<button class="btn ghost" id="cl">Cerrar</button></div>`;
 o.innerHTML=h;
 document.getElementById("cl").onclick=close;
 const rm=document.getElementById("rm"); if(rm) rm.onclick=()=>{delete picks[n]; save(); close(); fill();};
 const ins=document.getElementById("insBtn"); if(ins) ins.onclick=()=>{close(); openInspector(n, picks[n]);};
 const se=document.getElementById("cardSearch"); se.focus(); se.oninput=e=>renderCards(n,e.target.value);
}
const close=()=>document.getElementById("ov").classList.remove("open");

/* Inspector */
let currentInspectNum = null;
function openInspector(num, card){
 currentInspectNum = num;
 const ins = document.getElementById("inspector");
 document.getElementById("insCard").innerHTML = cardHTML(card);
 document.getElementById("insTitle").textContent = `#${num} ${card.name}`;
 document.getElementById("insRarity").textContent = card.rarity;
 document.getElementById("insSet").textContent = `${card.set} • Nº ${card.number||"?"}`;
 document.getElementById("insPrice").textContent = card.price ? eur(card.price) : "Sin precio registrado";
 
 const toggleBtn = document.getElementById("toggleSleeveBtn");
 toggleBtn.textContent = card.sleeve ? "⭐ QUITAR SLEEVE" : "⭐ PONER SLEEVE";
 
 drawChart(card.price || 10);
 ins.classList.add("open");
}

document.getElementById("toggleSleeveBtn").onclick=()=>{
 if(currentInspectNum && picks[currentInspectNum]){
  picks[currentInspectNum].sleeve = !picks[currentInspectNum].sleeve;
  save(); fill();
  document.getElementById("toggleSleeveBtn").textContent = picks[currentInspectNum].sleeve ? "⭐ QUITAR SLEEVE" : "⭐ PONER SLEEVE";
 }
};

function drawChart(basePrice){
 const cvs = document.getElementById("priceChart"); const ctx = cvs.getContext("2d");
 cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
 const pts = [basePrice * 0.85, basePrice * 0.92, basePrice * 0.88, basePrice * 1.05, basePrice * 0.98, basePrice];
 const max = Math.max(...pts) * 1.1, min = Math.min(...pts) * 0.9, w = cvs.width, h = cvs.height;
 ctx.clearRect(0,0,w,h); ctx.beginPath(); ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 3;
 pts.forEach((p, i)=>{
  const x = (i / (pts.length - 1)) * (w - 20) + 10, y = h - ((p - min) / (max - min)) * (h - 20) - 10;
  if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
 });
 ctx.stroke();
 pts.forEach((p, i)=>{
  const x = (i / (pts.length - 1)) * (w - 20) + 10, y = h - ((p - min) / (max - min)) * (h - 20) - 10;
  ctx.beginPath(); ctx.fillStyle = "#fff"; ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
 });
}

document.getElementById("closeIns").onclick=()=>document.getElementById("inspector").classList.remove("open");

/* Exportador PDF */
document.getElementById("exportPdfBtn").onclick=()=>{
 const { jsPDF } = window.jspdf;
 const doc = new jsPDF();
 doc.setFont("helvetica", "bold");
 doc.setFontSize(18);
 doc.text("REPORTE DE COLECCIÓN POKÉDEX TCG", 14, 20);
 
 doc.setFontSize(11);
 doc.setFont("helvetica", "normal");
 let totalVal = 0, count = 0;
 for(let n in picks){ totalVal += picks[n].price; count++; }
 
 doc.text(`Total Cartas: ${count} de ${N} (${Math.round(count/N*100)}%)`, 14, 28);
 doc.text(`Valoración Total Est.: ${eur(totalVal)}`, 14, 34);
 doc.line(14, 38, 196, 38);
 
 let y = 46;
 doc.setFontSize(9);
 doc.setFont("helvetica", "bold");
 doc.text("Nº", 14, y); doc.text("Pokémon", 26, y); doc.text("Expansión", 70, y); doc.text("Rareza", 125, y); doc.text("Precio", 175, y);
 doc.line(14, y+2, 196, y+2);
 y += 8;
 
 doc.setFont("helvetica", "normal");
 for(let n = 1; n <= N; n++){
  if(picks[n]){
   const c = picks[n];
   doc.text(`#${String(n).padStart(3,"0")}`, 14, y);
   doc.text(c.name + (c.sleeve ? " ⭐" : ""), 26, y);
   doc.text(c.set.substring(0,25), 70, y);
   doc.text(c.rarity.substring(0,22), 125, y);
   doc.text(eur(c.price), 175, y);
   y += 6;
   if(y > 280){ doc.addPage(); y = 20; }
  }
 }
 doc.save("Coleccion_Pokedex_TCG.pdf");
};

/* Controles */
document.getElementById("setFilterSelect").onchange=e=>{ selectedSetFilter = e.target.value; fill(); };
document.getElementById("themeSelect").onchange=e=>document.getElementById("cv").className=`fc cover fr ${e.target.value}`;

book.addEventListener("click",e=>{
 if(e.target.closest("#cv")){go(1);return;}
 const b=e.target.closest(".slot"); if(b&&b.dataset.n) openPoke(+b.dataset.n);
});
document.getElementById("sheet").addEventListener("click",e=>{
 const op=e.target.closest(".opt"); if(!op) return;
 const n=+document.getElementById("sheet").dataset.n, c=cache[n].find(x=>x.id===op.dataset.id);
 if(c){picks[n]=c; playPlaceSound(); save(); close(); fill();}
});
document.getElementById("ov").onclick=e=>{if(e.target.id==="ov")close();};
document.getElementById("prev").onclick=()=>go(s-1);
document.getElementById("next").onclick=()=>go(s+1);

fill(); go(0, true);
</script>
